name: Build Tasmota Custom

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Disable unwanted features
        run: |
          sed -i '/#ifndef USE_KNX/,/^#endif/d' tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#define USE_SONOFF_SPM/d' tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#define USE_DISPLAY_TM1621_SONOFF/d' tasmota/include/tasmota_configurations_ESP32.h
      - name: Build tasmota32
        run: pio run -e tasmota32 -j 4
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32-custom
          path: |
            .pio/build/tasmota32/firmware.bin
            .pio/build/tasmota32/firmware.factory.bin
